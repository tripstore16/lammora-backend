<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Lammora — دخول المسؤول إلى لوحة التحكم.">
  <meta name="robots" content="noindex, nofollow">
  <title>Lammora — دخول المسؤول</title>
  <link rel="icon" type="image/webp" href="/assets/images/lammora.webp">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <main id="main" class="login-main">
    <div class="login-wrapper">
      <div class="login-brand">
        <img src="/assets/images/lammora.webp" alt="شعار Lammora" class="login-logo" width="48" height="48">
        <h1 class="login-brand-name">Lammora</h1>
        <p class="login-brand-tagline">كل لمّة وليها حكاية</p>
      </div>

      <section class="login-card" aria-labelledby="loginTitle">
        <header class="login-card-head">
          <h2 id="loginTitle" class="login-title">دخول المسؤول</h2>
          <p class="login-subtitle">أدخل بيانات حسابك للوصول إلى لوحة التحكم.</p>
        </header>

        <form id="loginForm" class="login-form" novalidate autocomplete="on">
          <div class="form-field">
            <label for="username" class="form-label">اسم المستخدم</label>
            <input type="text" id="username" name="username" class="form-input" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="64" aria-describedby="usernameError">
            <p class="form-error" id="usernameError" hidden></p>
          </div>

          <div class="form-field">
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" class="form-input password-input" autocomplete="current-password" required minlength="1" maxlength="256" aria-describedby="passwordError">
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="إظهار كلمة المرور" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="form-error" id="passwordError" hidden></p>
          </div>

          <div class="form-error form-error-block" id="formError" role="alert" hidden></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span class="btn-label">دخول</span>
            <span class="btn-spinner" aria-hidden="true" hidden></span>
          </button>
        </form>

        <p class="login-back">
          <a href="/camera" class="link-muted">العودة إلى وضع الكاميرا</a>
        </p>
      </section>

      <footer class="login-footer">
        <p class="login-footer-text">الدخول مقصور على المسؤول المعتمد فقط.</p>
      </footer>
    </div>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="/js/shared/ui.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
